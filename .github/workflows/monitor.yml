name: Page Monitor

on:
  schedule:
    # 02:00 UTC = 09:00 GMT+7 (Asia/Bangkok)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Run page monitor
        run: python monitor.py

      - name: Notify Discord (only if changes detected)
        if: hashFiles('latest_changes.md') != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python notify_discord.py

      - name: Notify Telegram (only if changes detected)
        if: hashFiles('latest_changes.html') != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_telegram.py

      - name: Commit updated state
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add page_hashes.json snapshots/
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update state [auto]"
            git push
          fi
